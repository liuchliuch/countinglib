name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Verification profile
        required: true
        default: core
        type: choice
        options: [core, algorithms, reuse, all]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 2
      PYTHONDONTWRITEBYTECODE: 1
      VERIFY_SCOPE: ${{ inputs.scope || 'core' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Lean and restore cache
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Check public documentation
        run: python3 scripts/check_public_docs.py
      - name: Check verifier regressions
        run: python3 -m unittest discover -s tests -v
      - name: Retrieve locked dependency artifacts
        run: ./scripts/lake exe cache get
      - name: Verify selected source and declaration closure
        run: python3 scripts/verify.py --scope "$VERIFY_SCOPE" --workers 2
      - name: Compile public examples
        run: |
          ./scripts/lake lean docs/examples/RelationalCounting.lean
          ./scripts/lake lean docs/examples/GraphReduction.lean
          ./scripts/lake lean docs/examples/Interpolation.lean

