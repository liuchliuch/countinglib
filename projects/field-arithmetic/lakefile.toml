name = "countingFieldArithmetic"
version = "0.1.0"
defaultTargets = ["CountingFieldArithmetic"]
weakLeanArgs = ["-M8000", "-j1"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "countingPlanarMachines"
path = "../planar-machines"

[[require]]
name = "countingPlanarAlgorithms"
path = "../planar-algorithms"

[[require]]
name = "countingInterpolationMachine"
path = "../interpolation-machine"

[[lean_lib]]
name = "CountingFieldArithmetic"
roots = []
globs = ["Counting.Algorithm.FieldArithmetic", "Counting.Algorithm.FieldArithmetic.+"]
