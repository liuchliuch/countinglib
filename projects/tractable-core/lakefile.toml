name = "countingTractableCore"
version = "0.1.0"
defaultTargets = ["CountingTractableCore"]
weakLeanArgs = ["-M12000", "-j1"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "countingHolantCore"
path = "../holant-core"

[[lean_lib]]
name = "CountingTractableCore"
roots = []
globs = [
  "Holant.Kernel",
  "Holant.Proofs.Tractability.AffineMachine.Constraint",
  "Holant.Proofs.Tractability.AffineMachine.Elimination",
  "Holant.Proofs.Tractability.AffineMachine.FreePhase",
  "Holant.Proofs.Tractability.AffineMachine.Model",
  "Holant.Proofs.Tractability.AffineMachine.Reconstruction",
  "Holant.Proofs.Tractability.ProductElimination",
  "Holant.Proofs.Tractability.ProductEliminationBounds",
  "Holant.Tractable.Affine",
  "Holant.Tractable.AffineOperations",
  "Holant.Tractable.AffinePhase.Roots",
  "Holant.Tractable.AffinePhaseCriterion",
  "Holant.Tractable.Product",
  "Holant.Tractable.Scalars",
  "Holant.Tractable.TwoTranslate",
  "Holant.Tractable.TwoTranslate.Derivative",
  "Holant.Tractable.TwoTranslate.Phase",
  "Holant.Tractable.TwoTranslate.Support",
]
