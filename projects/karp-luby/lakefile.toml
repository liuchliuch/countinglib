name = "countingKarpLuby"
version = "0.1.0"
defaultTargets = ["CountingKarpLuby"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "CountingKarpLuby"
roots = []
globs = ["Counting.Algorithm.KarpLuby", "Counting.Algorithm.KarpLuby.+"]

[[lean_exe]]
name = "karpLubyExamples"
root = "Counting.Algorithm.KarpLuby.Examples"
