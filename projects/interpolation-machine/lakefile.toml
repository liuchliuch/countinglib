name = "countingInterpolationMachine"
version = "0.1.0"
defaultTargets = ["CountingInterpolationMachine"]
weakLeanArgs = ["-M8000", "-j1"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "countingInterpolation"
path = "../interpolation"

[[require]]
name = "holantUnified"
path = "../holant-unified"

[[require]]
name = "countingPlanarMachines"
path = "../planar-machines"

[[lean_lib]]
name = "CountingInterpolationMachine"
roots = []
globs = ["Counting.Algorithm.InterpolationMachine", "Counting.Algorithm.InterpolationMachine.Semantics", "Counting.Algorithm.InterpolationMachine.Postprocessor", "Counting.Algorithm.InterpolationMachine.Compiler", "Counting.Algorithm.InterpolationMachine.Graph", "Counting.Algorithm.InterpolationMachine.FieldSource", "Counting.Algorithm.InterpolationMachine.Clients", "Counting.Algorithm.InterpolationMachine.Materialized.Semantics", "Counting.Algorithm.InterpolationMachine.Materialized.Machine", "Counting.Algorithm.InterpolationMachine.Materialized.Clients"]
