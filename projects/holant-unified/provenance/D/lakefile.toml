name = "paper2Holant"
version = "1.0.0"
defaultTargets = ["Paper2", "Verification"]
weakLeanArgs = ["-M12000", "-j1"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "Holant"
globs = ["Holant.+"]

[[lean_lib]]
name = "Paper2"

[[lean_lib]]
name = "Verification"
globs = ["Verification.+"]
