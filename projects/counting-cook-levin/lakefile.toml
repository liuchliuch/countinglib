name = "countingCookLevin"
version = "0.1.0"
defaultTargets = ["CountingCookLevin"]
weakLeanArgs = ["-M8000", "-j2"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "countingPlanarMachines"
path = "../planar-machines"

[[require]]
name = "countingPlanarHom"
path = "../planar-homomorphisms"

[[require]]
name = "countingFoundations"
path = "../foundations"

[[require]]
name = "countingWitnessMachines"
path = "../witness-machines"

[[lean_lib]]
name = "CountingCookLevin"
roots = []
globs = ["Counting.CookLevin", "Counting.CookLevin.Target", "Counting.CookLevin.Compiler", "Counting.CookLevin.Evaluator", "Counting.CookLevin.Padding", "Counting.CookLevin.Membership", "Counting.CookLevin.Reduction", "Counting.CookLevin.Clients"]
