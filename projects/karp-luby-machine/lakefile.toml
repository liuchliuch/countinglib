name = "countingKarpLubyMachine"
version = "0.1.0"
defaultTargets = ["CountingKarpLubyMachine"]
weakLeanArgs = ["-M6000", "-j2"]
[leanOptions]
autoImplicit = false
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"
[[require]]
name = "countingKarpLuby"
path = "../karp-luby"
[[require]]
name = "countingFoundations"
path = "../foundations"
[[require]]
name = "holantUnified"
path = "../holant-unified"
[[lean_lib]]
name = "CountingKarpLubyMachine"
roots = []
globs = ["Counting.Algorithm.KarpLubyMachine", "Counting.Algorithm.KarpLubyMachine.+"]
