name = "countingKnowledgeCompilation"
version = "0.1.0"
defaultTargets = ["CountingKnowledgeCompilation"]
weakLeanArgs = ["-M8000", "-j1"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "partitionSemantics"
path = "../partition-semantics"

[[lean_lib]]
name = "CountingKnowledgeCompilation"
roots = []
globs = [
  "LeanSAT.Data.Cnf", "LeanSAT.Data.ICnf", "LeanSAT.Model.PropAssn",
  "LeanSAT.Model.PropForm", "LeanSAT.Model.PropFun", "LeanSAT.Model.PropVars",
  "LeanSAT.Upstream.ToStd", "LeanSAT.Upstream.ToMathlib",
  "ProofChecker.Data.Pog", "ProofChecker.Count.PropForm", "ProofChecker.Count.Pog",
  "Counting.Algorithm.CPOG", "Counting.Algorithm.CPOG.+"
]
