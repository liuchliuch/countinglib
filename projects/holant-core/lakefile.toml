name = "countingHolantCore"
version = "0.1.0"
defaultTargets = ["CountingHolantCore"]
weakLeanArgs = ["-M6000", "-j1"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "CountingHolantCore"
roots = []
globs = [
  "Holant.Signature",
  "Holant.Tensor",
  "Holant.Network",
  "Holant.Complexity.Encoding",
  "Holant.Complexity.ConstantMachine",
  "Holant.Complexity.WitnessCounting",
]
