name = "countingPfaffianFinite"
version = "0.1.0"
defaultTargets = ["CountingPfaffianFinite"]
weakLeanArgs = ["-M8000", "-j1"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "countingPfaffian"
path = "../pfaffian"

[[require]]
name = "countingFoundations"
path = "../foundations"

[[require]]
name = "countingPlanarHom"
path = "../planar-homomorphisms"

[[lean_lib]]
name = "CountingPfaffianFinite"
roots = []
globs = ["Counting.FiniteSupport", "Counting.FiniteSupport.Computer", "Counting.FiniteSupport.F1", "Counting.Algorithm.PfaffianFinite", "Counting.Algorithm.PfaffianFinite.Clients"]
