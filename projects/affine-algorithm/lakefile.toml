name = "countingAffine"
version = "0.1.0"
defaultTargets = ["CountingAffine"]
weakLeanArgs = ["-M6000", "-j1"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "partitionSemantics"
path = "../partition-semantics"

[[require]]
name = "holantUnified"
path = "../holant-unified"

[[require]]
name = "countingTractableCore"
path = "../tractable-core"

[[lean_lib]]
name = "CountingAffine"
roots = []
globs = [
  "Counting.Algorithm.Affine",
  "Counting.Algorithm.Affine.Basic",
  "Counting.Algorithm.Affine.Executor",
  "Counting.Algorithm.Affine.Partition",
  "Counting.Algorithm.Affine.FixedLanguage",
  "Counting.Algorithm.Affine.Clients"
]
