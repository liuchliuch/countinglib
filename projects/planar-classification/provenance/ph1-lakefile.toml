name = "countingPlanarHom"
version = "0.1.0"
defaultTargets = ["CountingPlanarHomSource"]
weakLeanArgs = ["-M8000", "-j1"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "countingFoundations"
path = "../foundations"

[[require]]
name = "partitionSemantics"
path = "../partition-semantics"

[[lean_lib]]
name = "CountingPlanarHomSource"
roots = []
globs = [
  "PlanarHom.ArithmeticCircuitPrimitives",
  "PlanarHom.Basic",
  "PlanarHom.BinaryAdditionBits",
  "PlanarHom.BinaryAdditionMachine",
  "PlanarHom.BinaryArithmetic",
  "PlanarHom.BinaryDivisionBits",
  "PlanarHom.BinaryDivisionMachine",
  "PlanarHom.BinaryGcdBits",
  "PlanarHom.BinaryGcdMachine",
  "PlanarHom.BinaryMultiplicationBits",
  "PlanarHom.BinaryMultiplicationMachine",
  "PlanarHom.BinarySubtractionBits",
  "PlanarHom.BinarySubtractionMachine",
  "PlanarHom.BitMachineSubroutine",
  "PlanarHom.BoundedIterationMachine",
  "PlanarHom.CertificateGeneratorCorrectness",
  "PlanarHom.CertificateGeneratorMachine",
  "PlanarHom.CertificateNondeterministicCompiler",
  "PlanarHom.CertificateWordCount",
  "PlanarHom.Complexity",
  "PlanarHom.ConstantMachines",
  "PlanarHom.FiniteReachableAlphabetMachines",
  "PlanarHom.InputLengthMachine",
  "PlanarHom.MachineCodeTransport",
  "PlanarHom.MachineOutputTransport",
  "PlanarHom.MachinePairing",
  "PlanarHom.NondeterministicCertificateBridge",
  "PlanarHom.NondeterministicComputationTree",
  "PlanarHom.NondeterministicReplayCompiler",
  "PlanarHom.NondeterministicRunCombinators",
  "PlanarHom.NondeterministicSharpP",
  "PlanarHom.NondeterministicTM2",
  "PlanarHom.OracleAccounting",
  "PlanarHom.OracleReductionComposition",
  "PlanarHom.OracleRunAccounting",
  "PlanarHom.OracleSubstitution",
  "PlanarHom.OracleSubstitutionOnTrace",
  "PlanarHom.PairProjectionMachines",
  "PlanarHom.RationalMultiplicationBits",
  "PlanarHom.RationalMultiplicationMachine",
  "PlanarHom.RationalNormalizationBits",
  "PlanarHom.RationalNormalizationMachine",
  "PlanarHom.RelationalStackTransfer",
  "PlanarHom.RestrictedIterationMachine",
  "PlanarHom.ReturningBitSubroutine",
  "PlanarHom.SharpPBridge",
  "PlanarHom.StackTransfer",
  "PlanarHom.UnaryPolynomialMachines",
]

[[lean_lib]]
name = "CountingPlanarHomFoundations"
roots = []
globs = ["Counting.Bridge.PlanarHomSharpP", "Counting.Examples.PlanarHomSharpP"]
