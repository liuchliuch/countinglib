name = "countingSharpPClosure"
version = "0.1.0"
defaultTargets = ["CountingSharpPClosure"]
weakLeanArgs = ["-M8000", "-j2"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "countingFoundations"
path = "../foundations"

[[require]]
name = "countingWitnessMachines"
path = "../witness-machines"

[[require]]
name = "countingPlanarHom"
path = "../planar-homomorphisms"

[[require]]
name = "countingPlanarMachines"
path = "../planar-machines"

[[require]]
name = "countingCookLevin"
path = "../counting-cook-levin"

[[lean_lib]]
name = "CountingSharpPClosure"
roots = []
globs = ["Counting.SharpPClosure", "Counting.SharpPClosure.Basic", "Counting.SharpPClosure.Machines", "Counting.SharpPClosure.Transport", "Counting.SharpPClosure.Clients"]
