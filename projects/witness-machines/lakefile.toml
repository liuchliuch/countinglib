name = "countingWitnessMachines"
version = "0.1.0"
defaultTargets = ["CountingWitnessMachines"]
weakLeanArgs = ["-M8000", "-j1"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "countingPlanarHom"
path = "../planar-homomorphisms"

[[require]]
name = "countingFoundations"
path = "../foundations"

[[lean_lib]]
name = "CountingWitnessMachines"
roots = []
globs = ["Counting.WitnessMachines.MappedReverse", "Counting.WitnessMachines.TaggedToFramed", "Counting.WitnessMachines.FramedToTagged", "Counting.WitnessMachines.BooleanOutput", "Counting.Bridge.WitnessSharpP", "Counting.WitnessMachines.Clients"]
