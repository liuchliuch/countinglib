name = "countingChargedReductions"
version = "0.1.0"
defaultTargets = ["CountingChargedReductions"]
weakLeanArgs = ["-M8000", "-j2"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "countingFoundations"
path = "../foundations"

[[require]]
name = "countingPlanarHom"
path = "../planar-homomorphisms"

[[require]]
name = "countingPlanarMachines"
path = "../planar-machines"

[[lean_lib]]
name = "CountingChargedReductions"
roots = []
globs = ["Counting.Reduction.OneQuery", "Counting.Reduction.OneQuery.Canonical", "Counting.Reduction.OneQuery.Run", "Counting.Reduction.OneQuery.Compiler", "Counting.Reduction.OneQuery.SharpP", "Counting.Reduction.OneQuery.Composition", "Counting.Reduction.OneQuery.Clients"]
