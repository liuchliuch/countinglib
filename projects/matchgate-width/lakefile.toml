name = "countingMatchgateWidth"
version = "0.1.0"
defaultTargets = ["CountingMatchgateWidth"]
weakLeanArgs = ["-M6000", "-j2"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "partitionSemantics"
path = "../partition-semantics"

[[lean_lib]]
name = "MatchgateWidthUpstream"
roots = []
globs = ["MatchgateWidth", "MatchgateWidth.+"]

[[lean_lib]]
name = "CountingMatchgateWidth"
roots = []
globs = ["Counting.MatchgateWidth", "Counting.MatchgateWidth.+"]
